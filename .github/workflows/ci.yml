name: Frontend Ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 라이브러리 설치
        run: npm ci

      - name: ESLint 검사
        run: npm run lint

      - name: 타입 검사 및 빌드
        run: npm run build
